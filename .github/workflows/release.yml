name: Sync upstream with Tailscale

on:
  schedule:
    # 每小时第 17 分钟检查上游；没有内容变更时不创建提交。
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-tailscale
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - name: Verify routing customization
        run: python3 -m unittest discover -s tests -v

      - name: Sync upstream configuration
        run: python3 scripts/sync_rules.py

      - name: Publish updated configuration
        run: |
          git add sr_top500_whitelist_ad.conf sr_direct_banad.conf
          if git diff --cached --quiet; then
            echo "Configuration is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync upstream rules with Tailscale routing"
          git push origin HEAD:release
